server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: rateplan-service
  datasource:
    url: jdbc:postgresql://localhost:5437/rateplan_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
