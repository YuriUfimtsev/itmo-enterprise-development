server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://localhost:5436/member_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: member-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
